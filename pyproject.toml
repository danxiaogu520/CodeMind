[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codemind"
version = "0.1.0"
description = "RAG Agent for repository-level code understanding"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "CodeMind Contributors" }]
dependencies = [
  "alembic>=1.16.4,<2",
  "asyncpg>=0.30.0,<1",
  "fastapi>=0.116.1,<1",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-postgres>=3.0,<4",
  "pathspec>=1.1.1",
  "psycopg[binary]>=3.3,<4",
  "pydantic-settings>=2.10.1,<3",
  "qdrant-client>=1.15.1,<2",
  "sqlalchemy[asyncio]>=2.0.41,<3",
  "structlog>=26.1.0,<27",
  "tree-sitter-language-pack>=1.13.1",
  "uvicorn[standard]>=0.35.0,<1",
]

[project.scripts]
codemind-api = "codemind.interfaces.http.cli:main"
codemind-worker = "codemind.interfaces.worker:main"
codemind-eval-retrieval = "codemind.evaluation.retrieval:main"
codemind-eval-agent = "codemind.evaluation.agent:main"
codemind-demo = "codemind.interfaces.demo_cli:main"

[dependency-groups]
dev = [
  "aiosqlite>=0.22.1",
  "httpx>=0.28.1,<1",
  "import-linter>=2.3,<3",
  "pyright>=1.1.403,<2",
  "pytest>=9.1.1,<10",
  "pytest-asyncio>=1.1.0,<2",
  "ruff>=0.12.4,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/codemind"]

[tool.uv]
package = true
default-groups = ["dev"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "apps"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"alembic/env.py" = ["E402"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src", "apps", "tests"]
exclude = [".venv", "alembic"]
venvPath = "."
venv = ".venv"
reportUnknownMemberType = "warning"
reportUnknownVariableType = "warning"
reportUnknownArgumentType = "warning"

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers --capture=sys"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "integration: requires external infrastructure",
]

[tool.importlinter]
root_packages = ["codemind"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain is independent"
type = "forbidden"
source_modules = ["codemind.domain"]
forbidden_modules = [
  "codemind.application",
  "codemind.infrastructure",
  "codemind.interfaces",
  "fastapi",
  "pydantic",
  "sqlalchemy",
  "qdrant_client",
  "langchain",
  "langchain_core",
  "langgraph",
]

[[tool.importlinter.contracts]]
name = "Application does not depend on delivery or infrastructure"
type = "forbidden"
source_modules = ["codemind.application"]
forbidden_modules = [
  "codemind.infrastructure",
  "codemind.interfaces",
  "langchain",
  "langchain_core",
  "langgraph",
]
