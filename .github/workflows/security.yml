name: 安全扫描

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL（Python）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 初始化 CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
      - name: 自动构建
        uses: github/codeql-action/autobuild@v3
      - name: 执行分析
        uses: github/codeql-action/analyze@v3

  dependency-review:
    name: 依赖变更审查
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 检查依赖风险
        uses: actions/dependency-review-action@v4
