# Local, zero-API-cost model stack sized for an 8 GiB NVIDIA GPU.
services:
  api:
    environment:
      CODEMIND_EMBEDDING_PROVIDER: ollama
      CODEMIND_EMBEDDING_MODEL: qwen3-embedding:0.6b
      CODEMIND_EMBEDDING_BASE_URL: http://ollama:11434
      CODEMIND_EMBEDDING_DIMENSIONS: 1024
      CODEMIND_EMBEDDING_TIMEOUT_SECONDS: 120
      CODEMIND_VECTOR_COLLECTION_NAME: codemind_code_chunks_qwen3_0_6b
      CODEMIND_LLM_PROVIDER: ollama
      CODEMIND_LLM_MODEL: qwen3:8b
      CODEMIND_LLM_BASE_URL: http://ollama:11434
      CODEMIND_LLM_TIMEOUT_SECONDS: 180
      CODEMIND_LLM_CONTEXT_WINDOW: 8192
      CODEMIND_LLM_MAX_OUTPUT_TOKENS: 1024
      CODEMIND_LLM_FALLBACK_TO_TEMPLATE: "true"
    depends_on:
      model-loader:
        condition: service_completed_successfully

  worker:
    environment:
      CODEMIND_EMBEDDING_PROVIDER: ollama
      CODEMIND_EMBEDDING_MODEL: qwen3-embedding:0.6b
      CODEMIND_EMBEDDING_BASE_URL: http://ollama:11434
      CODEMIND_EMBEDDING_DIMENSIONS: 1024
      CODEMIND_EMBEDDING_TIMEOUT_SECONDS: 120
      CODEMIND_VECTOR_COLLECTION_NAME: codemind_code_chunks_qwen3_0_6b
    depends_on:
      model-loader:
        condition: service_completed_successfully

  ollama:
    image: ollama/ollama:0.32.0
    gpus: all
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: 5m
      OLLAMA_MAX_LOADED_MODELS: 1
      OLLAMA_NUM_PARALLEL: 1
    ports:
      - "127.0.0.1:${CODEMIND_OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  model-loader:
    image: ollama/ollama:0.32.0
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        ollama pull qwen3-embedding:0.6b &&
        ollama pull qwen3:8b
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=32m,mode=1777

volumes:
  ollama-data:
